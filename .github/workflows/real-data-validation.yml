name: Real HBEDB validation

on:
  push:
    paths:
      - "real_data_analysis.py"
      - ".github/workflows/real-data-validation.yml"
  workflow_dispatch:

jobs:
  validate-real-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Analyse public HBEDB record BDS00001
        run: python real_data_analysis.py --record BDS00001
      - name: Show generated metrics
        run: cat real_data_outputs/BDS00001_metrics.csv
      - uses: actions/upload-artifact@v4
        with:
          name: hbedb-BDS00001-validation
          path: real_data_outputs/
